name: check translation

# Перекладач не має ігрових даних, тож ESM тут не збирається. Але тексти можна
# перевірити самі по собі: розсинхрон зрізів, втрачені підстановки (%PCName),
# дублі індексів, зіткнення назв тем. Ганяємо це на кожен пуш і в кожному PR,
# щоб помилка не доїхала до чиєїсь гри.

on:
  push:
    paths: ['tools/**']
  pull_request:
    paths: ['tools/**']
  workflow_dispatch:

# Партії перекладу пушаться одна за одною, і кожна ставила в чергу власний запуск.
# Черга з раннерів GitHub не завжди розгрібається: 2026-08-06 запуск провисів
# 15 хвилин і його скасували з «The job was not acquired by Runner of type hosted».
# Перевіряти проміжні коміти сенсу немає - тримаємо в черзі лише найсвіжіший.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Цілісність текстів
        run: python tools/topics/check_sources.py

      # Решта перевірок зі списку в CONVENTIONS. Тут лише ті, що читають самі
      # тексти: items/check_gender.py і dialogue/voiced.py потребують зібраних
      # плагінів, а гри на раннері немає й бути не може.
      #
      # Доти в CI ганялася сама лише перевірка вище, і то не тому, що інші
      # зайві, а тому, що вони не повертали коду помилки й завжди «успішні».
      - name: Одна назва - два написання
        run: python tools/q.py dup

      - name: Імена, що розійшлися
        run: python tools/name_drift.py

      - name: Числа в перекладі збігаються з першотвором
        run: python tools/check_numbers.py
