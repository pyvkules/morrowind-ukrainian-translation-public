name: build installer

# Збирає ukrainizer-setup.exe на кожен пуш у main, що зачепив переклад або сам
# інсталятор. Сенс простий: людина, яка хоче спробувати, не мусить ані ставити
# Python, ані знати про git - вона забирає один файл.
#
# Гри тут немає і бути не може, тож CI перевіряє лише те, що exe **збирається**
# і запускається. Що він робить із чужою грою, перевіряється вручну на живих
# конфігураціях: чистій і модпаковій.

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'l10n/**'
      - 'Fonts/**'
      - 'installer/**'
      - 'build.py'
      # зміну самого воркфлову теж треба перевіряти — інакше правка в ньому
      # мовчки не запускає нічого, і про поломку дізнаєшся наступного разу
      - '.github/workflows/installer.yml'
  workflow_dispatch:
  release:
    types: [published]

# Партії перекладу пушаться одна за одною, а збірка важча за перевірку текстів.
# Тримаємо в черзі лише найсвіжіший коміт - проміжні нікому не потрібні.
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

# Реліз оновлюємо з самого воркфлову, тож токену потрібне право на запис.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        # make.py питає в git, що саме наше: цим і проведено межу між нашим
        # перекладом і даними гри. Без історії ls-files усе одно працює.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Залежності
        run: pip install pyinstaller fonttools

      - name: Зібрати exe
        run: python installer/make.py

      - name: Перевірити, що запускається
        # Гри на раннері немає, тож інсталятор мусить чесно сказати, що не
        # знайшов OpenMW, і вийти з кодом 2. Якщо він падає інакше - збірка
        # зламана, і краще дізнатися про це тут, а не від тестувальника.
        shell: pwsh
        run: |
          $out = & ".\installer\dist\ukrainizer-setup.exe" --no-pause --cfg "Z:\none\openmw.cfg" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 2) {
            Write-Error "очікували код 2 (гру не знайдено), отримали $LASTEXITCODE"
            exit 1
          }
          if ($out -notmatch 'OpenMW') {
            Write-Error "вивід не схожий на наш"
            exit 1
          }
          # Обов'язково: інакше крок успадкує $LASTEXITCODE від самого exe,
          # а це двійка — і GitHub позначить успішну перевірку як провал.
          exit 0

      - name: Розмір
        shell: pwsh
        run: |
          $f = Get-Item ".\installer\dist\ukrainizer-setup.exe"
          "{0:N1} МБ" -f ($f.Length / 1MB)

      # Артефакт тут НЕ вантажимо навмисно. Він дублює реліз, але, на відміну
      # від нього, з'їдає сховище Actions: 20 МБ на кожен пуш, а безплатна
      # квота — 500 МБ. За півдня збірок вона скінчилася. Готовий файл лежить
      # у релізі: посилання стале, місця не займає, і завантажити його можна
      # без входу в GitHub.

      - name: Підписати
        # Підпис прибирає попередження SmartScreen, але потребує сертифіката,
        # який купує людина: приблизно 200-400 доларів на рік і перевірка
        # особи. Самопідписаний не зараховується — Windows довіряє не факту
        # підпису, а тому, хто його видав.
        #
        # Тому крок умовний: щойно в секретах репозиторію з'являться
        # SIGN_CERT (сертифікат .pfx у base64) і SIGN_PASS, збірка почне
        # підписуватися сама, без жодних інших змін.
        if: env.SIGN_CERT != ''
        env:
          SIGN_CERT: ${{ secrets.SIGN_CERT }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
          $tool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' `
                  -Recurse -Filter signtool.exe |
                  Where-Object { $_.FullName -match 'x64' } |
                  Select-Object -Last 1
          & $tool.FullName sign /fd SHA256 /f $pfx /p $env:SIGN_PASS `
            /tr http://timestamp.digicert.com /td SHA256 `
            installer/dist/ukrainizer-setup.exe
          Remove-Item $pfx -Force
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      - name: Опис релізу
        shell: pwsh
        run: |
          $stats = python tools/stats.py --md | Out-String
          $body = @"
          Свіжа збірка з гілки ``main``. Оновлюється автоматично на кожну
          партію перекладу — окремих версій тут немає й не треба.

          **Як поставити:** завантаж ``ukrainizer-setup.exe`` нижче й запусти.
          Windows скаже «Windows protected your PC» — це тому, що файл не
          підписаний сертифікатом; **Докладніше → Виконати в будь-якому разі**.

          Потрібен **OpenMW**. На оригінальному ``Morrowind.exe`` не працює:
          той рушій не вміє шрифтів, у яких є українські літери.

          $stats

          Зібрано з $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)
          "@
          $body | Out-File -FilePath release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Оновити реліз
        # Одна «рухома» позначка замість нової версії на кожен пуш: посилання
        # .../releases/latest лишається сталим, і людині не треба нічого
        # шукати. Артефакт вище — для нас: він вимагає входу в GitHub і
        # зникає, а реліз доступний будь-кому й назавжди.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Українізатор — свіжа збірка
          body_path: release-notes.md
          make_latest: true
          files: installer/dist/ukrainizer-setup.exe
